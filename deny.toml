# cargo-deny policy: licences, advisories, bans, sources.
#
# Run with `cargo deny check`. CI runs it on every pull request.

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # Reached only through the Tauri crate, which is outside the workspace and is
    # checked by the `desktop shell compiles` job. `proc-macro-error` is unmaintained
    # (RUSTSEC-2024-0370) but has no known vulnerability, and the fix is upstream: it
    # arrives when Tauri's build-time dependency tree drops `gtk-rs`'s old `syn 1.x`
    # path. Reviewed 2026-11-14; re-check when Tauri 3 or a newer `tauri-build` lands.
    { id = "RUSTSEC-2024-0370", reason = "transitive through tauri-build; no known exploit" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Path dependencies inside a workspace carry no version requirement by design; a
# wildcard on a registry dependency is still denied.
wildcards = "deny"
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
