[workspace]
resolver = "2"
members = [
    "crates/slate-ucs",
    "crates/slate-engine",
    "crates/slate-cli",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Jon Evans"]
repository = "https://github.com/SoundsLikeJonny/Slate-To-UCS"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
regex = "1.10"
sha2 = "0.10"
proptest = "1.5"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
