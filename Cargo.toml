[workspace]
resolver = "2"
members = [
    "crates/slate-audio",
    "crates/slate-ucs",
    "crates/slate-engine",
    "crates/slate-tagger",
    "crates/slate-cli",
    "tools/xtask",
]
# The Tauri binary is built by `cargo tauri build`, not by the workspace: compiling a
# WebView on three CI runners would slow every Rust job and needs GTK headers on Linux.
# Its testable logic lives in `crates/slate-shell`.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["Jon Evans"]
repository = "https://github.com/SoundsLikeJonny/Slate-To-UCS"
# This is an application, not a library set. Nothing here is published to crates.io,
# which also lets `cargo deny` treat the intra-workspace path dependencies as private.
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
regex = "1.10"
sha2 = "0.10"
proptest = "1.5"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
