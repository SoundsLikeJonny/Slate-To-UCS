name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `macos-14` was retired as a hosted runner label; `macos-latest` tracks
        # whatever image GitHub currently publishes.
        os: [windows-2022, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  coverage:
    name: coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: coverage floors
        run: cargo llvm-cov --workspace --fail-under-lines 85 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info
          retention-days: 7

  versions:
    name: versions and changelog
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: manifests agree
        run: cargo xtask verify-versions
      - name: changelog has an Unreleased section
        run: cargo xtask changelog --check

  docs:
    name: documentation links
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: links resolve
        run: cargo xtask docs-check

  shell:
    name: desktop shell compiles
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: deny
        run: |
          cargo install cargo-deny --locked
          cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml check

  golden:
    name: golden corpus is current
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ttucs
        run: pip install "ttucs==0.3.0" pytest
      - name: tool tests
        run: python -m pytest tools/tests -q
      - name: regenerate and compare
        run: python tools/gen_golden.py --check

  ui:
    name: ui (typecheck, test, build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm --dir apps/desktop typecheck
      - name: test
        run: pnpm --dir apps/desktop test
      - name: build
        run: pnpm --dir apps/desktop build

  supply-chain:
    name: supply chain
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - name: licences and advisories
        run: cargo deny check
